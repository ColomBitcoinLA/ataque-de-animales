name: CI
on:
  push:
    branches:
      - chore/m0-safety-net
      - main
  pull_request:

jobs:
  safety-net-gate:
    name: M0 Safety Net & Regression Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm 12.3.4
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Verify Frozen Lockfile Installation
        run: pnpm install --frozen-lockfile

      - name: Run M0 Regression Gate
        run: pnpm run gate:m0
