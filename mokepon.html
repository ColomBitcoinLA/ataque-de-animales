<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./css/mokepon.css">
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
        <title>Animal Combat</title>
    </head>
    <body>
        
        <button id="mute-toggle" class="mute-btn" title="Silenciar sonido">🔊</button>

        <section id="lobby-section" class="lobby-section">
            <h1 class="tituloPrincipal">Animal Combat</h1>
            <p class="lobby-subtitle">Elige cómo jugar</p>

            <div class="auth-bar">
                <button id="btn-login" class="auth-bar-btn">👤 Iniciar Sesión / Registro</button>
                <button id="btn-profile" class="auth-bar-btn">🏆 Mi Perfil</button>
                <button id="btn-logout" class="auth-bar-btn hidden">🚪 Cerrar Sesión</button>
            </div>

            <div id="profile-card" class="profile-card"></div>

            <div class="lobby-buttons">
                <button id="btn-quick-match" class="lobby-btn lobby-btn-online">⚡ Partida Rápida</button>
                <button id="btn-create-room" class="lobby-btn lobby-btn-room">🏠 Crear Sala Privada</button>
                <button id="btn-join-room" class="lobby-btn lobby-btn-join">🔑 Unirse con Código</button>
                <button id="btn-single-player" class="lobby-btn lobby-btn-solo">🤖 Jugar vs IA</button>
            </div>

            <input id="room-code-input" class="room-code-input hidden" type="text" maxlength="4" placeholder="Código (ej: K9X2)" autocomplete="off" />
            <button id="btn-confirm-join" class="animarBoton hidden" style="margin-top:8px">Unirse</button>

            <div id="room-code-display" class="room-code-display hidden">
                <p>Código de sala:</p>
                <span class="room-code-value" data-code=""></span>
            </div>

            <div id="difficulty-selector" class="difficulty-selector hidden">
                <p class="subtitulo">Elige dificultad:</p>
                <label class="diff-option"><input type="radio" name="difficulty" value="facil" /> 🟢 Fácil</label>
                <label class="diff-option"><input type="radio" name="difficulty" value="normal" checked /> 🟡 Normal</label>
                <label class="diff-option"><input type="radio" name="difficulty" value="dificil" /> 🔴 Difícil</label>
                <button id="btn-start-solo" class="animarBoton" style="margin-top:12px">Jugar</button>
            </div>

            <p id="lobby-status" class="lobby-status"></p>
            <button id="btn-cancel-match" class="animarBoton hidden" style="margin-top:8px;font-size:0.9rem">Cancelar</button>
        </section>

        <section id="seleccionar-mascota" class="contenedor-mascotas">

            <h1 id="tituloH1" class="tituloPrincipal">Animal Combat</h1>
            <h2 class="subtitulo">Elige tu mascota:</h2>

            <div id="contenedor-tarjetas" class="tarjetas">
                
            </div>

            <button id="botonMascota" class="animarBoton">Continuar</button>
        </section>

        <section id="ver-mapa">

            <h1 class="tituloPrincipal">Mapa de Animal Combat</h1>
            <canvas id="mapa"></canvas> 

            <div class="contenedor-botonesCanva">
                
                <button id="botonIniciarPelea" class="animarBoton" style="margin-top: 15px;">Iniciar pelea</button>

                <div class="grid-direccion">
                    <button type="button" class="arriba">⬆️</button>
                    <button type="button" class="izquierda">⬅️</button>
                    <button type="button" class="derecha">➡️</button>
                    <button type="button" class="abajo">⬇️</button>
                </div>
            </div>
        </section>

        <section id="seleccionar-ataque" class="contenedor-ataques">

            <h1 class="tituloPrincipal">Animal Combat</h1>
            <h2 class="subtitulo">Elige tu ataque:</h2>

            <div id="ap-container" class="ap-container">
                <span class="ap-label">Energía:</span>
                <div id="ap-display" class="ap-display"></div>
            </div>

            <div id="contenedor-ataque" class="tarjetas-ataques">
                
            </div>

            <div id="mensajes" class="contenedor-mensajes">
                <p id="resultado">Mucha suerte!</p>

                <section id="reiniciar" class="contenedor-reiniciar">
                    <button id="botonReiniciar" class="reiniciarBoton">Volver a Jugar</button>
                </section>
            </div>

            <div class="contenedor-resultados">
                <div class="contenedor-jugador">
                    <span id="mascota-jugador"></span>
                    <div id="hp-bar-jugador" class="hp-bar">
                        <div id="hp-bar-fill-jugador" class="hp-bar-fill hp-high"></div>
                        <span id="hp-text-jugador" class="hp-text">100/100</span>
                    </div>
                    <span id="vidas-jugador" class="rounds-score">0</span>
                    <span id="status-jugador" class="status-badge" style="display:none"></span>
                    <div id="ataqueDelJugador"></div>
                </div>

                <div class="contenedor-enemigo">
                    <span id="mascota-enemigo"></span>
                    <div id="hp-bar-enemigo" class="hp-bar">
                        <div id="hp-bar-fill-enemigo" class="hp-bar-fill hp-high"></div>
                        <span id="hp-text-enemigo" class="hp-text">100/100</span>
                    </div>
                    <span id="vidas-enemigo" class="rounds-score">0</span>
                    <span id="status-enemigo" class="status-badge" style="display:none"></span>
                    <div id="ataqueDelEnemigo"></div>
                </div>
            </div>

            <canvas id="combat-particles-canvas" class="combat-particles-canvas"></canvas>
        </section>

        <script type="module" src="./js/main.js"></script>
    </body>
</html>
